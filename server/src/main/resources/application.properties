# Server
server.port=8888
server.forward-headers-strategy=framework

# Actuator — Prometheus 메트릭 엔드포인트 노출
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=never


# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# 파일 업로드 최대 크기 — 엑셀 가져오기용 (nginx client_max_body_size 10m 과 같은 값, Spring 기본값은 파일 1MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT 만료 시간 (ms) — 로컬/운영 공통 고정값, .env 로 바꾸지 않는다
# access 30분: 탈취돼도 서버가 취소할 수 없으므로 짧게 / refresh 30일: HttpOnly 쿠키 + DB 대조로 관리
jwt.access-expiration=1800000
jwt.refresh-expiration=2592000000

# refresh 토큰 쿠키 Secure — 로컬은 http 라 false (운영은 application-docker.properties 에서 true)
app.auth.cookie-secure=false

# CORS — 로컬 개발 기본값 (운영은 application-docker.properties 에서 덮어씀)
app.cors.allowed-origins=http://localhost:3000
