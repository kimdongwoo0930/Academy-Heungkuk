name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - main

# 배포가 겹치지 않도록 — 새 push 가 들어오면 진행 중인 건 취소
concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/heungkuk-backend
  CLIENT_IMAGE: ghcr.io/${{ github.repository_owner }}/heungkuk-client

jobs:
  # ── 이미지 빌드 ─────────────────────────────────────────────
  # ubuntu-24.04-arm = GitHub 무료 ARM 러너(퍼블릭 레포 한정).
  # 서버가 ARM 이라 여기서 네이티브로 빌드해야 QEMU 에뮬레이션(5~10배 느림)을 피한다.
  build-backend:
    name: Build backend image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  build-client:
    name: Build client image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          # NEXT_PUBLIC_* 는 빌드 시점에 번들에 박히므로 여기서 주입해야 한다
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.CLIENT_IMAGE }}:latest
            ${{ env.CLIENT_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max

  # ── 배포 ────────────────────────────────────────────────────
  # 빌드가 둘 다 성공해야만 실행된다. 서버는 pull + 교체만 하므로 수 초면 끝.
  deploy:
    name: Deploy to server
    needs: [build-backend, build-client]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/academy-heungkuk-v2-
            # compose / nginx / 모니터링 설정 파일은 계속 서버 디스크에서 마운트되므로 레포는 최신으로 유지
            git fetch origin main
            git reset --hard origin/main
            # 인프라 설정은 infra/ 아래 — compose 는 앱·모니터링 두 파일을 합쳐 쓰므로 항상 래퍼로 실행
            COMPOSE="infra/compose.sh"

            # (1회성) 인증서를 옛 위치(nginx/ssl)에서 새 위치(infra/nginx/ssl)로 복사 — 이미 있으면 건너뜀
            if [ ! -d infra/nginx/ssl ] && [ -d nginx/ssl ]; then
              cp -a nginx/ssl infra/nginx/ssl
              chmod 600 infra/nginx/ssl/origin.key
            fi

            # nginx 설정 검사 — 저장소의 새 설정 그대로 일회용 컨테이너에서 검사, 틀리면 여기서 배포 중단
            docker run --rm --network academy-heungkuk-v2-_hka-network \
              -v "$PWD/infra/nginx/conf.d:/etc/nginx/conf.d:ro" -v "$PWD/infra/nginx/snippets:/etc/nginx/snippets:ro" \
              -v "$PWD/infra/nginx/ssl:/etc/nginx/ssl:ro" \
              nginx:1.29.6-alpine nginx -t

            $COMPOSE pull backend client
            # --no-deps: db·모니터링은 건드리지 않음 / nginx 는 설정(마운트 경로·이미지)이 바뀐 경우에만 재생성
            $COMPOSE up -d --no-deps backend client nginx
            # 바뀐 nginx 설정 반영 — reload 는 기존 연결을 끊지 않음
            docker exec hka-nginx nginx -s reload
            # 안 쓰는 이미지 정리 — 어떤 컨테이너도 쓰지 않고 만든 지 7일 지난 이미지 (-a: 이름 있는 이미지 포함)
            # 최근 7일 이미지는 서버 롤백용으로 남김, 그보다 오래된 앱 이미지는 GHCR 에서 SHA 태그로 다시 받을 수 있음
            docker image prune -af --filter "until=168h"
