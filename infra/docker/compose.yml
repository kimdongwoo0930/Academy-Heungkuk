# 앱 스택 — db, backend, client, nginx + 공용 네트워크·볼륨
#
# 실행은 항상 래퍼로:  infra/compose.sh <명령>
#   (= docker compose -f compose.yml --env-file <루트>/.env)
# - 상대 경로는 이 폴더(infra/docker/) 기준, .env(비밀값)는 저장소 루트

# 프로젝트 이름 고정 — compose 는 기본으로 "파일이 있는 폴더 이름"을 프로젝트 이름으로 쓰는데,
# 이름이 바뀌면 볼륨(academy-heungkuk-v2-_mysql_data 등)·네트워크를 새로 만들어 DB 가 비어 보이게 된다
name: academy-heungkuk-v2-

# 모든 서비스 공통 (YAML 앵커 — 파일 안에서만 유효)
x-common: &common
  restart: unless-stopped
  networks:
    - hka-network
  # 컨테이너 로그(docker logs) 크기 제한 — 10MB 가 차면 새 파일, 최대 3개(30MB) 유지 후 오래된 것부터 삭제
  # (Docker 는 기간 기준 삭제를 지원하지 않음. 앱 로그 원본은 logs/*.log 에 따로 보관)
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# 외부 이미지는 운영 중인 버전으로 고정 (latest 는 재생성·서버 재구성 시 예고 없이 메이저 버전이 바뀔 수 있음)
# 버전을 올릴 때는 태그를 바꾸고 해당 서비스만 pull / up 한다
services:
  db:
    <<: *common
    image: mysql:8.0.45
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    <<: *common
    # 평소엔 CI(GitHub Actions)가 GHCR에 올린 이미지를 pull 해서 쓴다.
    # BACKEND_IMAGE 를 .env 에서 특정 태그로 지정하면 그 버전으로 롤백된다.
    image: ${BACKEND_IMAGE:-ghcr.io/kimdongwoo0930/heungkuk-backend:latest}
    # build 는 로컬에서 직접 빌드하고 싶을 때만 쓰는 폴백 (서버 배포 경로에선 사용 안 함)
    build:
      context: ../../server
      dockerfile: Dockerfile
    container_name: spring
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      TZ: Asia/Seoul
    volumes:
      - ../../logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  client:
    <<: *common
    image: ${CLIENT_IMAGE:-ghcr.io/kimdongwoo0930/heungkuk-client:latest}
    # NEXT_PUBLIC_API_URL 은 빌드 시점에 번들에 박히므로,
    # 서버 배포 경로에선 CI 시크릿으로 주입된다(아래 args 는 로컬 빌드용).
    build:
      context: ../../client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: frontend
    environment:
      TZ: Asia/Seoul
    volumes:
      - ../../CHANGELOG.md:/app/CHANGELOG.md:ro
    depends_on:
      - backend

  nginx:
    <<: *common
    image: nginx:1.29.6-alpine
    container_name: hka-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/conf.d:/etc/nginx/conf.d          # 서버 블록 (역할별 파일)
      - ../nginx/snippets:/etc/nginx/snippets:ro   # 공통 조각 (ssl, proxy, 보안 헤더) — conf.d 에서 include
      - ../nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend

  loki:
    <<: *common
    image: grafana/loki:3.4.2
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ../loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  alloy:
    <<: *common
    image: grafana/alloy:v1.21.2
    container_name: alloy
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ../alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ../../logs:/var/log/app:ro      # spring 컨테이너와 같은 호스트 logs/ 를 읽기 전용으로
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

networks:
  hka-network:
    driver: bridge

volumes:
  loki-data:
  alloy-data:
  mysql_data:
