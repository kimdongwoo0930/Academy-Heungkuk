# 실행: 저장소 루트에서
#   docker compose -f infra/docker/docker-compose.yml --env-file .env <명령>
# - 상대 경로는 이 파일(infra/docker/) 기준
# - .env(비밀값)는 저장소 루트에 두고 --env-file 로 지정

# 프로젝트 이름 고정 — compose 는 기본으로 "파일이 있는 폴더 이름"을 프로젝트 이름으로 쓰는데,
# 이름이 바뀌면 볼륨(academy-heungkuk-v2-_mysql_data 등)·네트워크를 새로 만들어 DB 가 비어 보이게 된다
name: academy-heungkuk-v2-

# 외부 이미지는 운영 중인 버전으로 고정 (latest 는 재생성·서버 재구성 시 예고 없이 메이저 버전이 바뀔 수 있음)
# 버전을 올릴 때는 여기 태그를 바꾸고 해당 서비스만 pull / up 한다
services:
  db:
    image: mysql:8.0.45
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hka-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # 평소엔 CI(GitHub Actions)가 GHCR에 올린 이미지를 pull 해서 쓴다.
    # BACKEND_IMAGE 를 .env 에서 특정 태그로 지정하면 그 버전으로 롤백된다.
    image: ${BACKEND_IMAGE:-ghcr.io/kimdongwoo0930/heungkuk-backend:latest}
    # build 는 로컬에서 직접 빌드하고 싶을 때만 쓰는 폴백 (서버 배포 경로에선 사용 안 함)
    build:
      context: ../../server
      dockerfile: Dockerfile
    container_name: spring
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      TZ: Asia/Seoul
    volumes:
      - ../../logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hka-network
    restart: unless-stopped

  nginx:
    image: nginx:1.29.6-alpine
    container_name: hka-nginx
    # 공식 nginx 이미지는 /var/log/nginx/access.log → /dev/stdout (pipe) 심볼릭 링크로 생성
    # Promtail은 pipe를 읽지 못하므로 시작 전 심볼릭 링크를 제거하고 실제 파일로 교체
    command: >
      /bin/sh -c "
        rm -f /var/log/nginx/access.log /var/log/nginx/error.log &&
        touch /var/log/nginx/access.log /var/log/nginx/error.log &&
        nginx -g 'daemon off;'
      "
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/conf.d:/etc/nginx/conf.d
      - ../nginx/ssl:/etc/nginx/ssl
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
    networks:
      - hka-network
    restart: unless-stopped

  client:
    image: ${CLIENT_IMAGE:-ghcr.io/kimdongwoo0930/heungkuk-client:latest}
    # NEXT_PUBLIC_API_URL 은 빌드 시점에 번들에 박히므로,
    # 서버 배포 경로에선 CI 시크릿으로 주입된다(아래 args 는 로컬 빌드용).
    build:
      context: ../../client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: frontend
    environment:
      TZ: Asia/Seoul
    volumes:
      - ../../CHANGELOG.md:/app/CHANGELOG.md:ro
    depends_on:
      - backend
    networks:
      - hka-network
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: hka-node-exporter
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /:/host:ro,rslave
    networks:
      - hka-network
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: hka-cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    networks:
      - hka-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.11.1
    container_name: hka-prometheus
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    networks:
      - hka-network
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.1
    container_name: hka-loki
    volumes:
      - ../monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - hka-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.6.8
    container_name: hka-promtail
    volumes:
      - ../../logs:/var/log/spring
      - nginx_logs:/var/log/nginx # NGINX 로그 수집
      - ../monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    networks:
      - hka-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.2
    container_name: hka-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=${GRAFANA_SMTP_USER}
      - GF_SMTP_PASSWORD=${GRAFANA_SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${GRAFANA_SMTP_USER}
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_USERS_ALLOW_SIGN_UP=false # 회원가입 막기
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus
    networks:
      - hka-network
    restart: unless-stopped

networks:
  hka-network:
    driver: bridge

volumes:
  mysql_data:
  loki_data:
  grafana_data:
  prometheus_data:
  nginx_logs:
