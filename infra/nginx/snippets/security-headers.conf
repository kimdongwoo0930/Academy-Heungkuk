# 브라우저 보안 헤더 (프론트용)
# - API 는 Spring Security 가 같은 헤더를 보내므로 쓰지 않음 (중복 방지)
# - CSP 는 Next.js 인라인 스크립트 때문에 화면이 깨질 수 있어 보류
# - 주의: location 안에서 add_header 를 쓰면 server 단위의 add_header 가 전부 무시되므로, 이 파일은 server 단위에서만 include
include /etc/nginx/snippets/hsts.conf;
add_header X-Content-Type-Options "nosniff" always;                               # 파일 종류 추측 실행 금지
add_header X-Frame-Options "DENY" always;                                         # iframe 삽입(클릭재킹) 금지
add_header Referrer-Policy "strict-origin-when-cross-origin" always;              # 외부로 URL 경로·쿼리 미전달
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;  # 쓰지 않는 기기 권한 차단
