# 업스트림(spring / frontend / grafana)으로 넘길 공통 프록시 헤더
# 주의: location 안에서 proxy_set_header 를 하나라도 쓰면 바깥 설정은 상속되지 않으므로, 필요한 헤더는 전부 이 파일로 include
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;                      # real_ip 적용 후 = 실제 접속자 IP
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
