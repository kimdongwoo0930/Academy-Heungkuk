# nginx 는 conf.d/*.conf 를 파일 이름 순서대로 읽는다 (번호 = 읽는 순서)
# 00: http 공통 설정 / 01: 실제 IP 복원 / 10~20: 기본 서버 / 30~: 도메인별 서버 — 공통 조각은 ../snippets/

# 접근 로그 (JSON) — Promtail 이 nginx_logs 볼륨에서 읽어 Loki 로 보냄
# ip: real_ip 적용 후 실제 접속자 IP (01-cloudflare-realip.conf)
log_format json_combined escape=json
  '{'
    '"time":"$time_iso8601",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":"$status",'
    '"ip":"$remote_addr",'
    '"response_time":"$request_time"'
  '}';

access_log /var/log/nginx/access.log json_combined;

# 에러 페이지·Server 헤더에서 nginx 버전 숨김
server_tokens off;
