# Grafana — grafana.academy-hk.com → hka-grafana:3000
# Grafana 는 nosniff / X-Frame-Options 를 자체로 보내므로 HSTS 만 추가
server {
    listen 443 ssl;
    server_name grafana.academy-hk.com;

    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/hsts.conf;

    location / {
        proxy_pass http://hka-grafana:3000;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/proxy-upgrade.conf;
    }
}
