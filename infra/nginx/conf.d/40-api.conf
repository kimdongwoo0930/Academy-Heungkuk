# 백엔드 API — api.academy-hk.com → Spring (spring:8888)
# 보안 헤더는 Spring Security 가 보내므로 여기서 추가하지 않음
server {
    listen 443 ssl;
    server_name api.academy-hk.com;

    include /etc/nginx/snippets/ssl.conf;

    # 요청 본문 최대 크기 — 엑셀 가져오기 업로드용 (Spring multipart 제한과 같은 10MB, nginx 기본값은 1MB)
    client_max_body_size 10m;

    location / {
        proxy_pass http://spring:8888;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/proxy-upgrade.conf;
    }
}
