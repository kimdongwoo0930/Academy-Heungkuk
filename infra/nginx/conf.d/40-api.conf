# 백엔드 API — api.academy-hk.com → Spring (spring:8888)
# 보안 헤더는 Spring Security 가 보내므로 여기서 추가하지 않음
server {
    listen 443 ssl;
    server_name api.academy-hk.com;

    include /etc/nginx/snippets/ssl.conf;

    # 요청 본문 최대 크기 — 엑셀 가져오기 업로드용 (Spring multipart 제한과 같은 10MB, nginx 기본값은 1MB)
    client_max_body_size 10m;

    # Actuator — 외부에는 health 만 공개 (가동 확인용, show-details=never 라 UP/DOWN 만 노출)
    # prometheus 는 Prometheus 컨테이너가 내부 네트워크에서 spring:8888 로 직접 수집하므로 nginx 를 거치지 않는다
    location = /actuator/health {
        proxy_pass http://spring:8888;
        include /etc/nginx/snippets/proxy.conf;
    }

    # 그 외 actuator(prometheus, info 등)는 외부 차단 — 403 대신 404 로 존재 자체를 숨김
    # ~* : 대소문자 무시 (/ACTUATOR/prometheus 같은 변형도 차단, 위의 = 정확 일치가 정규식보다 우선)
    location ~* ^/actuator {
        return 404;
    }

    location / {
        proxy_pass http://spring:8888;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/proxy-upgrade.conf;
    }
}
