# 프론트엔드 — academy-hk.com, www.academy-hk.com → Next.js (frontend:3000)
server {
    listen 443 ssl;
    server_name academy-hk.com www.academy-hk.com;

    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/security-headers.conf;

    location / {
        proxy_pass http://frontend:3000;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/proxy-upgrade.conf;
        proxy_cache_bypass $http_upgrade;
        proxy_hide_header X-Powered-By;   # "Next.js" 기술 정보 숨김
    }
}
