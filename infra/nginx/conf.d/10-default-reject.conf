# 등록된 도메인이 아닌 요청(서버 IP 직접 접속, 모르는 Host/SNI)은 응답하지 않는다
# (1차 차단은 Oracle 보안 목록 — 80/443 은 Cloudflare 대역만 허용. 이건 설정 실수에 대비한 2차 차단)
server {
    listen 80 default_server;
    server_name _;
    return 444;   # 응답 없이 연결 종료
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;   # 모르는 SNI 는 TLS 연결 단계에서 거부 (인증서도 내보내지 않음)
}
