# 서버 시스템 로그(journald) 보관 설정 — 한 달 지난 로그 삭제, 최대 500MB
# (배포로 적용되지 않는 서버 OS 설정. 새 서버 구성 시 한 번 설치 — infra/README.md "서버 OS 설정" 참고)
#   sudo install -m 644 infra/host/journald/retention.conf /etc/systemd/journald.conf.d/retention.conf
#   sudo systemctl restart systemd-journald
[Journal]
MaxRetentionSec=1month
SystemMaxUse=500M
