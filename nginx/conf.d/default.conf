# 맨 위에 추가
log_format json_combined escape=json
  '{'
    '"time":"$time_iso8601",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":"$status",'
    '"ip":"$remote_addr",'
    '"response_time":"$request_time"'
  '}';

access_log /var/log/nginx/access.log json_combined;


# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    server_name academy-hk.com www.academy-hk.com api.academy-hk.com;
    return 301 https://$host$request_uri;
}

# # 프론트엔드 (academy-hk.com)
server {
    listen 443 ssl;
    server_name academy-hk.com www.academy-hk.com;

    # Cloudflare Origin Certificate
    ssl_certificate /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;


    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 백엔드 API (api.academy-hk.com)
server {
    listen 443 ssl;
    server_name api.academy-hk.com;

    # Cloudflare Origin Certificate
    ssl_certificate /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Actuator — 외부에는 health 만 공개 (UptimeRobot 가동 확인용, show-details=never 라 UP/DOWN 만 노출)
    # prometheus 는 Prometheus 컨테이너가 내부 네트워크에서 spring:8888 로 직접 수집하므로 nginx 를 거치지 않는다
    location = /actuator/health {
        proxy_pass http://spring:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 그 외 actuator(prometheus, info 등)는 외부 차단 — 403 대신 404 로 존재 자체를 숨김
    # ~* : 대소문자 무시 (/ACTUATOR/prometheus 같은 변형도 nginx 에서 차단, 위의 = 정확 일치가 정규식보다 우선)
    location ~* ^/actuator {
        return 404;
    }

    location / {
        proxy_pass http://spring:8888;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


