# 맨 위에 추가
log_format json_combined escape=json
  '{'
    '"time":"$time_iso8601",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":"$status",'
    '"ip":"$remote_addr",'
    '"response_time":"$request_time"'
  '}';

access_log /var/log/nginx/access.log json_combined;

# 에러 페이지·Server 헤더에서 nginx 버전 숨김
server_tokens off;

# 등록된 도메인이 아닌 요청(서버 IP 직접 접속, 모르는 Host/SNI)은 응답하지 않는다
# (1차 차단은 Oracle 보안 목록 — 80/443 은 Cloudflare 대역만 허용. 이건 설정 실수에 대비한 2차 차단)
server {
    listen 80 default_server;
    server_name _;
    return 444;   # 응답 없이 연결 종료
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;   # 모르는 SNI 는 TLS 연결 단계에서 거부 (인증서도 내보내지 않음)
}


# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    server_name academy-hk.com www.academy-hk.com api.academy-hk.com grafana.academy-hk.com;
    return 301 https://$host$request_uri;
}

# # 프론트엔드 (academy-hk.com)
server {
    listen 443 ssl;
    server_name academy-hk.com www.academy-hk.com;

    # Cloudflare Origin Certificate
    ssl_certificate /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 보안 헤더 (always: 404/500 같은 에러 응답에도 포함)
    # - API 는 Spring Security 가 이미 보내므로 여기(프론트)에만 추가 — 중복 헤더 방지
    # - CSP 는 Next.js 인라인 스크립트 때문에 화면이 깨질 수 있어 보류
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # 이후 HTTPS 로만 접속
    add_header X-Content-Type-Options "nosniff" always;                                # 파일 종류 추측 실행 금지
    add_header X-Frame-Options "DENY" always;                                          # iframe 삽입(클릭재킹) 금지
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;               # 외부로 URL 경로·쿼리 미전달
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;   # 쓰지 않는 기기 권한 차단


    location / {
        proxy_pass http://frontend:3000;
        proxy_hide_header X-Powered-By;   # "Next.js" 기술 정보 숨김
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 백엔드 API (api.academy-hk.com)
server {
    listen 443 ssl;
    server_name api.academy-hk.com;

    # Cloudflare Origin Certificate
    ssl_certificate /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Actuator — 외부에는 health 만 공개 (UptimeRobot 가동 확인용, show-details=never 라 UP/DOWN 만 노출)
    # prometheus 는 Prometheus 컨테이너가 내부 네트워크에서 spring:8888 로 직접 수집하므로 nginx 를 거치지 않는다
    location = /actuator/health {
        proxy_pass http://spring:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 그 외 actuator(prometheus, info 등)는 외부 차단 — 403 대신 404 로 존재 자체를 숨김
    # ~* : 대소문자 무시 (/ACTUATOR/prometheus 같은 변형도 nginx 에서 차단, 위의 = 정확 일치가 정규식보다 우선)
    location ~* ^/actuator {
        return 404;
    }

    location / {
        proxy_pass http://spring:8888;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


#Grafana
server {
    listen 443 ssl;
    server_name grafana.academy-hk.com;

    ssl_certificate /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Grafana 는 nosniff / X-Frame-Options 를 자체로 보내므로 HSTS 만 추가
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://hka-grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
